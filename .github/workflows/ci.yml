name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,llm]"
      - name: Unit, property, golden and realism tests
        run: pytest -m "not e2e" --cov=premier_analytics --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e ".[dev,llm]" && python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: web
      - name: Browser tests (scripted offline models)
        run: pytest tests/e2e

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t premier-analytics:ci .
      - name: Container starts and serves (keyless config, as in production)
        run: |
          docker run -d --name pa -p 8000:8000 \
            -e AZURE_OPENAI_ENDPOINT=https://example.services.ai.azure.com/api/projects/p \
            -e LIVE_MODEL_DEPLOYMENT=gpt-4.1-mini -e RECAP_MODEL_DEPLOYMENT=gpt-5-mini \
            premier-analytics:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs pa; exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
